    default: true
    workspace:
      host: https://dbc-acc3fdf9-9dbe.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-acc3fdf9-9dbe.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/labuser11492310_1757302126@vocareum.com to make sure we only have a single copy.
